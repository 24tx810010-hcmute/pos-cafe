name: POS light CI

on:
  push:
    branches-ignore:
      - docs
      - 'evidence/permission-docs-*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: pos-light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    name: Build, unit, tooling and mock UI
    if: github.repository == 'nguyentronglinh045/pos-cafe' && github.repository_id == '1263057386'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Run bounded CI and publish safe summary
        run: node scripts/project-ci-launch.mjs
