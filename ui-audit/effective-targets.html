<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>UI audit effective target controls</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #scroller { position: absolute; left: 20px; top: 20px; width: 200px; height: 80px; overflow: auto; }
  #off-scroll { width: 100px; height: 30px; }
  #footer { position: absolute; left: 20px; top: 120px; width: 200px; height: 40px; }
  #healthy-label { position: absolute; left: 20px; top: 200px; display: flex; align-items: center;
    width: 180px; height: 40px; cursor: pointer; }
  #healthy-label-input { width: 13px; height: 13px; }
  #partly-label { position: absolute; left: 20px; top: 260px; display: flex; align-items: center;
    width: 160px; height: 40px; cursor: pointer; }
  #partly-label-input { width: 13px; height: 13px; }
  #label-cover { position: absolute; left: 40px; top: 260px; width: 140px; height: 40px; }
  #corner-label { position: absolute; left: 20px; top: 320px; display: flex; align-items: center;
    width: 200px; height: 40px; cursor: pointer; }
  #corner-label-input { width: 13px; height: 13px; }
  #corner-cover { position: absolute; left: 40px; top: 336px; width: 150px; height: 24px; }
  #multi-label-input { position: absolute; left: 20px; top: 390px; width: 13px; height: 13px; }
  #small-associated-label { position: absolute; left: 50px; top: 380px; width: 20px; height: 20px; }
  #large-associated-label { position: absolute; left: 80px; top: 380px; width: 160px; height: 40px; }
  #anchor-label { position: absolute; left: 20px; top: 450px; width: 180px; height: 40px; }
  #anchor-label-input { width: 13px; height: 13px; }
  #anchor-cover { position: absolute; inset: 0; z-index: 1; }
  #clipped-parent { position: absolute; left: 450px; top: 20px; width: 200px; height: 80px; overflow: clip; }
  #clipped-button { width: 100px; height: 30px; }
  #nested-outer { position: absolute; left: 700px; top: 20px; width: 200px; height: 80px; overflow: hidden; }
  #nested-scroller { width: 100%; height: 100%; overflow: auto; }
  #nested-button { width: 100px; height: 30px; }
  #disabled-input { position: absolute; left: 20px; top: 510px; width: 13px; height: 13px; }
  #offscreen-label-scroll { position: absolute; left: 20px; top: 580px; width: 200px; height: 80px; overflow: auto; }
  #offscreen-label { display: flex; align-items: center; width: 160px; height: 40px; cursor: pointer; }
  #offscreen-label-input { width: 13px; height: 13px; }
  #small-button { position: absolute; left: 250px; top: 200px; width: 16px; height: 16px; }
  #covered-button, #cover { position: absolute; left: 300px; top: 30px; width: 100px; height: 40px; }
  #cover { z-index: 1; }
</style>
<div id="scroller"><div style="height: 100px"></div><button id="off-scroll">Cuộn tới tôi</button></div>
<button id="footer">Nút footer</button>
<label id="healthy-label"><input id="healthy-label-input" type="checkbox">Vùng bấm rộng</label>
<label id="partly-label"><input id="partly-label-input" type="checkbox">Nhãn bị che gần hết</label>
<div id="label-cover"></div>
<label id="corner-label"><input id="corner-label-input" type="checkbox">Góc bấm đủ rộng</label>
<div id="corner-cover"></div>
<input id="multi-label-input" type="checkbox">
<label id="small-associated-label" for="multi-label-input">A</label>
<label id="large-associated-label" for="multi-label-input">Nhãn thứ hai đủ rộng</label>
<label id="anchor-label"><input id="anchor-label-input" type="checkbox">
  <a id="anchor-cover" href="#linked">Liên kết phủ nhãn</a></label>
<div id="clipped-parent"><div style="height:100px"></div><button id="clipped-button">Không thể cuộn tới</button></div>
<div id="nested-outer"><div id="nested-scroller"><div style="height:100px"></div>
  <button id="nested-button">Cuộn bên trong</button></div></div>
<label><input id="disabled-input" type="checkbox" disabled>Nhãn của input đã vô hiệu</label>
<div id="offscreen-label-scroll"><div style="height:100px"></div>
  <label id="offscreen-label"><input id="offscreen-label-input" type="checkbox">Nhãn cuộn tới được</label></div>
<button id="small-button" aria-label="Nút thật nhỏ"></button>
<button id="covered-button">Bị che thật</button><button id="cover">Lớp che</button>
</html>
