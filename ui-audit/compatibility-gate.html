<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Cafe — compatibility gate audit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Measurement-only fixture: render the application's actual gate without
      // changing src or manufacturing a production backend failure.
      if (import.meta.env.VITE_DATA_MODE !== "mock") throw new Error("UI_AUDIT_REQUIRES_MOCK");
      const { AppError } = await import("/src/core/appError.ts");
      const { requireCompatibilityUpdate } = await import("/src/app/compatibilityGate.ts");
      if (new URLSearchParams(location.search).has("created")) {
        const { useAppStore } = await import("/src/app/useAppStore.ts");
        useAppStore.setState({ createdStoreResult: {
          storeId: "10000000-0000-4000-8000-000000000001", storeNo: 1,
          storeKey: "0001-AUDITKEY", adminPin: "123456",
          seedStatus: "seeded", canRetrySeed: false,
        } });
      }
      requireCompatibilityUpdate(new AppError("WRITE_PROTOCOL_UNSUPPORTED", "Ứng dụng cần được cập nhật trước khi tiếp tục."));
      await import("/src/main.tsx");
    </script>
  </body>
</html>
